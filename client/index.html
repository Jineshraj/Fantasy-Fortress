<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover is required for env(safe-area-inset-*) to be
         non-zero on iOS; .bottom-nav and .player-modal both depend on it. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Fantasy Fortress Season 2</title>
    <meta
      name="description"
      content="Private fantasy football league — live standings, squads, fixtures, H2H league and Super Cup."
    />
    <meta name="theme-color" content="#6c18d1" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Fantasy Fortress" />
    <!-- League crest from public/Fantasy Fortress/. Doubles as the tab and
         home-screen icon; icon.svg remains as a generic fallback. -->
    <link rel="icon" type="image/png" href="/Fantasy%20Fortress/Fantasy-fortress-logo.png" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/Fantasy%20Fortress/Fantasy-fortress-logo.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
